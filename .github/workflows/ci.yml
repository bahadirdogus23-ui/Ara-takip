# Her gönderimde ve PR'da: kod kuralları, tip kontrolü, birim testleri, veritabanı (RLS)
# testleri, canlı derleme (PDF paket kontrolü dahil) ve tarayıcıda kabul testleri.
name: Kontroller

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontroller:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: derleme-icin
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  kabul-testleri:
    runs-on: ubuntu-24.04
    needs: kontroller
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .e2e/bin
            .e2e/storage
          key: e2e-yigin-${{ hashFiles('scripts/e2e-stack.sh', 'scripts/e2e-storage-build.sh') }}
      - run: ./scripts/e2e-storage-build.sh
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/e2e-stack.sh
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-izleri
          path: test-results/
          retention-days: 7
